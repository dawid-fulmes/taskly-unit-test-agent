name: test-agent prepare
description: >
  Installs the trusted test-agent tooling and, optionally, the work tree's app dependencies without
  lifecycle scripts (ADR 0009). Must be used from the trusted checkout. No secret is available here.
inputs:
  trusted:
    description: Path of the trusted (base) checkout.
    required: true
  work:
    description: Path of the work checkout whose app dependencies are installed ('' to skip).
    required: false
    default: ''
  image:
    description: Pinned runner image to pull ('' to skip).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - name: Install trusted tooling
      shell: bash
      working-directory: ${{ inputs.trusted }}/tools/test-agent
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Install work dependencies without lifecycle scripts
      if: inputs.work != ''
      shell: bash
      env:
        WORK: ${{ inputs.work }}
      run: |
        for app in backend frontend; do
          (cd "$WORK/$app" && npm ci --ignore-scripts --no-audit --no-fund)
        done
    - name: Pull the runner image
      if: inputs.image != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: docker pull --quiet "$IMAGE"
    - name: Put test-agent-run on PATH
      shell: bash
      env:
        TRUSTED: ${{ inputs.trusted }}
      run: echo "$TRUSTED/tools/test-agent/bin" >> "$GITHUB_PATH"
