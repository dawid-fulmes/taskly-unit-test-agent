name: test-agent-backfill

# Manual backfill (ADR 0015): the same pipeline in backfill mode, for one app at a time. The
# test-agent-backfill environment (required reviewers, main only) gates the model key.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to backfill
        type: choice
        options: [backend, frontend]
        required: true
      max_files:
        description: Files per run
        type: number
        default: 8

permissions: {}

jobs:
  pipeline:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/test-agent-pipeline.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      mode: backfill
      app: ${{ inputs.app }}
      max_files: ${{ inputs.max_files }}
      base_ref: ${{ github.event.repository.default_branch }}
      budget_profile: backfill
    secrets: inherit
