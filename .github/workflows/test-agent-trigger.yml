name: test-agent-trigger

# Unprivileged half of the pipeline (ADR 0020). This file runs with the PR's own YAML, so it
# holds no secrets and does nothing but record which PR and commit to process. Everything it
# writes is treated as untrusted data by test-agent-pr.yml, which runs from main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record the trigger
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          mkdir -p trigger
          node -e '
            const t = {
              prNumber: Number(process.env.PR_NUMBER),
              headSha: process.env.HEAD_SHA,
              action: process.env.ACTION,
            }
            if (process.env.LABEL) t.label = process.env.LABEL
            require("fs").writeFileSync("trigger/trigger.json", JSON.stringify(t))
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trigger
          path: trigger/trigger.json
          retention-days: 1
